[project]
name = "klaxon-mcp"
version = "0.2.0"
description = "MCP server for Wazuh 5.x. Query any events or findings datastream, discover which schema fields are actually populated, run logtest. Generic tools instead of fifty narrow ones. 5.x only — no 4.x compatibility layer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Marco Moenig", email = "marco.moenig@sec73.io" },
]
maintainers = [
    { name = "sec73 GmbH", email = "marco.moenig@sec73.io" },
]

dependencies = [
    # Upper bounds are deliberate: dependabot opens PRs to raise them, and the
    # full-suite + mypy CI gate must pass before a bump merges (see
    # .github/dependabot.yml and the unit-tests job).
    "mcp>=2.0.0,<3",
    "httpx>=0.27,<1",
    # Optional YAML config file for the anonymization block (KLAXON_CONFIG).
    # The import is guarded, so the feature degrades gracefully without it.
    "pyyaml>=6.0,<7",
    # Direct API import in transport.py (CORSMiddleware for the HTTP transport).
    # mcp pulls starlette in transitively, but the direct import must not rely
    # on that graph — declared here with the same deliberate upper-bound policy.
    "starlette>=1.3.1,<2",
]

[project.urls]
Homepage = "https://github.com/sec73/klaxon"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
# `klaxon` is the canonical name; `klaxon-mcp` is kept as a compatibility alias.
# Both expose the same CLI, including `klaxon masking generate|selftest|salt-check`.
klaxon = "klaxon_mcp.__main__:main"
klaxon-mcp = "klaxon_mcp.__main__:main"
# The DSGVO plausibility checker as a standalone CLI (`klaxon-mcp --gdpr-check`
# is the same code with the same flags).
klaxon_check_gdpr = "klaxon_mcp.__main__:gdpr_cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klaxon_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default is the bare prefix "test", which also collects an imported
# `tester_sessions` as a test case. Every test here is named test_*.
python_functions = ["test_*"]
markers = [
    "integration: requires a live OpenSearch/Wazuh 5 indexer; skipped unless KLAXON_INDEXER_URL/KLAXON_INDEXER_USER/KLAXON_INDEXER_PASSWORD are all set",
    "live: alias for integration — the live masking pipeline test (_execute + _simulate, no writes)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/klaxon_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/ARCHITECTURE.md",
    "/docs",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]
